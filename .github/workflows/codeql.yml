# GitHub's own search for vulnerable code: the Python of the plugins, and
# the workflows themselves. The findings land in the Security tab.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  # New queries find old code: once a week even when nothing was pushed.
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  # On main every commit keeps its run; a scheduled run is not cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # uploads the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Neither language is compiled: the sources are read as they are.
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
